<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Колония на Марсе</title>
  <!-- Telegram WebApp SDK: даёт доступ к имени игрока и теме Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Сюда app.js рисует все экраны игры -->
  <main id="app"></main>
  <!-- Клиент Supabase (для командной игры). Версия указана точно, чтобы сайт не сломался от обновлений. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <!-- game.js — экран командной игры; lobby.js — меню, комнаты, лобби и кнопки. Оба после app.js, game.js раньше lobby.js. -->
  <script src="game.js"></script>
  <script src="lobby.js"></script>
</body>
</html>
