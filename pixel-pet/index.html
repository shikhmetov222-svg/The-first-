<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Пиксель-питомец</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="top"><h1>Пиксель-питомец</h1><div class="coins" title="Монеты">🪙 <b id="coins">0</b></div></header>
    <div class="stage"><canvas id="scene" width="192" height="144"></canvas></div>
    <p class="status" id="status"></p>
    <div class="stats">
      <div class="stat"><span class="lab">🍖 Сытость</span><div class="bar"><i id="b-food"></i></div><span class="val" id="v-food"></span></div>
      <div class="stat"><span class="lab">😊 Настроение</span><div class="bar"><i id="b-mood"></i></div><span class="val" id="v-mood"></span></div>
      <div class="stat"><span class="lab">🫧 Чистота</span><div class="bar"><i id="b-clean"></i></div><span class="val" id="v-clean"></span></div>
      <div class="stat"><span class="lab">⚡ Энергия</span><div class="bar"><i id="b-energy"></i></div><span class="val" id="v-energy"></span></div>
    </div>
    <div class="actions">
      <button data-act="feed"><span>🍖</span><b>Кормить</b></button>
      <button data-act="play"><span>🎾</span><b>Играть</b></button>
      <button data-act="wash"><span>🫧</span><b>Мыть</b></button>
      <button data-act="sleep" id="btn-sleep"><span>🌙</span><b>Спать</b></button>
    </div>
    <div class="toast" id="toast"></div>
  </main>
  <script src="js/sprites.js"></script>
  <script src="js/room.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
