<title>CAPITAL Твой город</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: a one-screen game tab — top bar, filter chips, the shared city map filling the rest, bottom tab bar. Dark only, like the game. */
:root{
  --bg:#0B0C0F; --surface:#15171C; --sunk:#0F1014; --line:#23262E;
  --fg:#F2F2F4; --muted:#9EA3AD; --gold:#D4A73A; --gold-soft:#2A2312; --gold-ink:#0B0C0F;
  --up:#5FD39A; --down:#F07167; --lot:#3FBF8F;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
.app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font:700 14px var(--display);flex:none}
.co{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub b{color:var(--fg)}
.tog{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);flex:none}
.tog button{min-height:36px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:700 13px var(--body);cursor:pointer}
.tog button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font:700 13px var(--body);cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.chips .dot{width:8px;height:8px;border-radius:50%}
.stage{position:relative;flex:1;min-height:300px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#10131d}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.legend{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:12px;background:rgba(11,12,15,.8);font-size:11px;color:#C9CCD3;pointer-events:none}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .heat-scale{display:none;align-items:center;gap:6px}
.legend.heat-on .heat-scale{display:flex}
.heat-scale em{font-style:normal}
.heat-scale i{width:56px;height:8px;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#facc15,#ef4444)}
.card{position:absolute;left:10px;right:10px;bottom:10px;padding:14px;border-radius:18px;background:rgba(21,23,28,.97);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card-head{display:flex;align-items:flex-start;gap:10px}
.card-dot{width:12px;height:12px;border-radius:4px;margin-top:4px;flex:none}
.card-title{flex:1;min-width:0}
.card-name{font-weight:800;font-size:16px}
.card-owner{font-size:12px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap}
.tag.mine{background:var(--gold-soft);color:var(--gold)}
.tag.rival{background:#2a1515;color:var(--down)}
.tag.bot{background:#22252b;color:var(--muted)}
.tag.lot{background:#10261c;color:var(--lot)}
.tag.build{background:#2b1a0c;color:#FB923C}
.card-desc{font-size:13px;color:#C9CCD3;line-height:1.45}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1 1 110px;padding:8px 10px;border-radius:12px;background:var(--sunk)}
.stat small{display:block;font-size:11px;color:var(--muted)}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px}
.actions button{flex:1;height:44px;border-radius:12px;font:800 14px var(--body);cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
.actions button.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.close{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 16px var(--body);cursor:pointer;flex:none}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 24px);padding:8px 12px;border-radius:10px;background:rgba(11,12,15,.92);border:1px solid var(--line);font-size:13px;color:var(--fg);pointer-events:none;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{height:52px;border:0;background:transparent;color:var(--muted);font:600 11px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--gold);font-weight:800}
.tabs svg{width:22px;height:22px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

<div class="app">
  <header class="top">
    <div class="me">
      <div class="logo" aria-hidden="true">ИГ</div>
      <div style="min-width:0">
        <div class="co">Иванов Групп</div>
        <div class="sub">Капитал <b>412 300 ₽</b> · 4 бизнеса · 6 районов</div>
      </div>
    </div>
    <div class="tog" role="group" aria-label="Время суток">
      <button type="button" id="btn-day" aria-pressed="true">День</button>
      <button type="button" id="btn-night" aria-pressed="false">Ночь</button>
    </div>
  </header>

  <div class="chips" role="group" aria-label="Что показать на карте">
    <button type="button" id="f-all" aria-pressed="true">Все</button>
    <button type="button" id="f-mine" aria-pressed="false"><span class="dot" style="background:var(--gold)"></span>Мои</button>
    <button type="button" id="f-lots" aria-pressed="false"><span class="dot" style="background:var(--lot)"></span>Свободные участки</button>
    <button type="button" id="f-rivals" aria-pressed="false"><span class="dot" style="background:var(--down)"></span>Конкуренты</button>
    <button type="button" id="f-heat" aria-pressed="false">Спрос</button>
    <button type="button" id="f-grow"><span class="dot" style="background:#FB923C"></span>Рост города ▸</button>
  </div>

  <div class="stage" id="stage">
    <div class="stage-msg" id="msg">Строим твой город…</div>
    <div class="legend" id="legend">
      <span><i style="background:var(--gold)"></i>Твои бизнесы</span>
      <span><i style="background:#8A8F98"></i>Флажок — конкурент</span>
      <span><i style="background:var(--lot)"></i>Свободный участок</span>
      <span><i style="background:#FB923C"></i>Стройка — район скоро откроется</span>
      <span class="heat-scale"><em>Спрос</em><i></i></span>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="card" id="card" hidden aria-live="polite">
      <div class="card-head">
        <span class="card-dot" id="c-dot"></span>
        <div class="card-title"><div class="card-name" id="c-name"></div><div class="card-owner" id="c-owner"></div></div>
        <span class="tag" id="c-tag"></span>
        <button type="button" class="close" id="c-close" aria-label="Закрыть">×</button>
      </div>
      <div class="card-desc" id="c-desc"></div>
      <div class="stats" id="c-stats"></div>
      <div class="actions"><button type="button" class="primary" id="c-a1"></button><button type="button" id="c-a2"></button></div>
    </div>
  </div>

  <nav class="tabs" aria-label="Разделы игры">
    <button type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Карта</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V9l7-5 7 5v12"></path><path d="M9 21v-6h6v6"></path></svg>Империя</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 4 8-9"></path><path d="M15 6h5v5"></path></svg>Рынок</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg>Рейтинг</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Профиль</button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const stage = document.getElementById('stage');
  const msg = document.getElementById('msg');
  if (!window.THREE) { msg.textContent = '3D-библиотека не загрузилась. Обнови страницу.'; return; }

  const ready = document.fonts && document.fonts.ready
    ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))])
    : Promise.resolve();
  ready.then(init);

  function init(){
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
    catch (e) { msg.textContent = 'Это устройство не поддерживает 3D. В игре здесь включится простой 2D-режим.'; return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const canvas = renderer.domElement;
    canvas.setAttribute('aria-label', '3D-улица с твоими бизнесами');
    stage.prepend(canvas);
    msg.remove();

    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    /* ---------- scene, camera, light ---------- */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10131d);
    scene.fog = new THREE.Fog(0x10131d, 25, 48);

    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
    const OFFSET = new THREE.Vector3(7, 11, 17);
    const HOME = new THREE.Vector3(0, 2.4, 1);
    const target = HOME.clone();
    const LIGHT_OFF = new THREE.Vector3(8, 14, 10);
    function placeCamera(){
      camera.position.copy(target).add(OFFSET); camera.lookAt(target);
      dir.position.copy(target).add(LIGHT_OFF); dir.target.position.copy(target); dir.target.updateMatrixWorld();
    }

    function resize(){
      const w = stage.clientWidth, h = stage.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      const a = w / h; let hw, hh;
      if (a < 1.3) { hw = 9; hh = hw / a; } else { hh = 7; hw = hh * a; }
      camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    const hemi = new THREE.HemisphereLight(0x6f7fb0, 0x1a1a22, 0.32);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0x9fb0ff, 0.22);
    dir.position.set(8, 14, 10);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    Object.assign(dir.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 0.5, far: 60 });
    dir.shadow.bias = -0.0006;
    scene.add(dir); scene.add(dir.target);

    /* ---------- materials & helpers ---------- */
    const MCACHE = new Map();
    const M = (c, o) => { const k = c + (o ? JSON.stringify(o) : ''); let m = MCACHE.get(k); if (!m) { m = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .85, metalness: 0, flatShading: true }, o || {})); MCACHE.set(k, m); } return m; };
    const winMat = M(0x2a2a30, { emissive: 0xffc66b, emissiveIntensity: 1, roughness: .3, flatShading: false });
    const doorMat = M(0x1a1410);
    const whiteMat = M(0xf0ece4);
    const darkMat = M(0x14161b);
    const woodMat = M(0x8a6a45);
    const leafMat = M(0x3f8f5a);
    const brickMat = M(0x8c4a32);
    const roofMat = M(0xa8492f);
    const steelMat = M(0x9aa0aa);
    const glassMat = new THREE.MeshStandardMaterial({ color: 0xa9d4f5, transparent: true, opacity: .3, roughness: .1, metalness: .2 });
    const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffe08a });
    // night lighting: soft glows around bulbs and warm light pools on the ground (no real lights, cheap on phones)
    const glowTex = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      gr.addColorStop(0, 'rgba(255,214,140,1)'); gr.addColorStop(.35, 'rgba(255,190,100,.42)'); gr.addColorStop(1, 'rgba(255,170,80,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    const glowMat = new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
    const poolMat = new THREE.MeshBasicMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: .5 });
    function glow(x, y, z, s){ const sp = new THREE.Sprite(glowMat); sp.scale.set(s, s, 1); sp.position.set(x, y, z); scene.add(sp); return sp; }
    function pool(x, z, s, y){ const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), poolMat); m.rotation.x = -Math.PI / 2; m.position.set(x, y || .13, z); scene.add(m); return m; }

    function box(w, h, d, m){ const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); me.castShadow = true; me.receiveShadow = true; return me; }
    function cyl(r1, r2, h, m, s){ const me = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, s || 10), m); me.castShadow = true; me.receiveShadow = true; return me; }
    function cone(r, h, m, s){ const me = new THREE.Mesh(new THREE.ConeGeometry(r, h, s || 10), m); me.castShadow = true; return me; }
    function panel(w, h, m){ return new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); }
    function add(parent, mesh, x, y, z){ mesh.position.set(x, y, z); parent.add(mesh); return mesh; }
    function body(g, w, h, d, m, x){ return add(g, box(w, h, d, m), x || 0, h / 2, -d / 2); }
    function front(g, w, h, m, x, y, z){ return add(g, panel(w, h, m), x, y, z === undefined ? .012 : z); }

    // gable roof, triangle facing the street, ridge running back
    function gable(w, d, rh, m){
      const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, rh); s.closePath();
      const geo = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false }); geo.translate(0, 0, -d);
      const me = new THREE.Mesh(geo, m); me.castShadow = true; me.receiveShadow = true; return me;
    }
    // pitched roof with the ridge running along the street
    function eaveRoof(w, d, rh, m){
      const s = new THREE.Shape(); s.moveTo(-d / 2, 0); s.lineTo(d / 2, 0); s.lineTo(0, rh); s.closePath();
      const geo = new THREE.ExtrudeGeometry(s, { depth: w, bevelEnabled: false }); geo.translate(0, 0, -w / 2); geo.rotateY(Math.PI / 2);
      const me = new THREE.Mesh(geo, m); me.castShadow = true; me.receiveShadow = true; return me;
    }

    function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

    const texCache = {};
    function signTex(lines, color, w, h){
      const key = lines.join('|') + color + w + 'x' + h;
      if (texCache[key]) return texCache[key];
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d');
      g.fillStyle = '#0B0C0F'; g.fillRect(0, 0, w, h);
      g.strokeStyle = color; g.lineWidth = 8; g.strokeRect(6, 6, w - 12, h - 12);
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = color;
      if (lines.length === 1) {
        const size = Math.min(Math.round(h * 0.46), Math.round((w - 40) / Math.max(3, lines[0].length) * 1.25));
        g.font = '700 ' + size + 'px Unbounded, Manrope, sans-serif';
        g.fillText(lines[0], w / 2, h / 2 + 2);
      } else {
        g.font = '700 ' + Math.round(h * 0.28) + 'px Unbounded, Manrope, sans-serif';
        g.fillText(lines[0], w / 2, h * 0.36);
        g.font = '800 ' + Math.round(h * 0.2) + 'px Manrope, sans-serif';
        g.fillStyle = '#F2F2F4';
        g.fillText(lines[1], w / 2, h * 0.7);
      }
      const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
      texCache[key] = t; return t;
    }
    function sign(lines, color, w, h){
      const t = signTex(lines, color, 512, Math.max(64, Math.round(512 * h / w)));
      return panel(w, h, new THREE.MeshBasicMaterial({ map: t }));
    }
    function frontSign(g, text, color, w, y, x, z){
      x = x || 0; z = z === undefined ? .03 : z;
      add(g, box(w + .06, .48, .06, darkMat), x, y, z);
      add(g, sign([text], color, w, .42), x, y, z + .035);
    }
    function vSignTex(text, color){
      const key = 'v' + text + color;
      if (texCache[key]) return texCache[key];
      const c = document.createElement('canvas'); c.width = 128; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#120d1a'; g.fillRect(0, 0, 128, 512);
      g.strokeStyle = color; g.lineWidth = 6; g.strokeRect(5, 5, 118, 502);
      g.fillStyle = color; g.shadowColor = color; g.shadowBlur = 16;
      g.font = '700 50px Unbounded, Manrope, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      const chars = Array.from(text), step = 490 / chars.length;
      chars.forEach((ch, i) => g.fillText(ch, 64, 11 + step * (i + .5)));
      const t = new THREE.CanvasTexture(c); texCache[key] = t; return t;
    }
    function bladeSign(g, text, color, x, y, z){
      add(g, box(.06, 2.16, .48, darkMat), x, y, z);
      const b = panel(.42, 2.1, new THREE.MeshBasicMaterial({ map: vSignTex(text, color) }));
      b.rotation.y = Math.PI / 2; add(g, b, x + .04, y, z);
    }

    function awning(width, accentHex, depth){
      depth = depth || .75;
      const g = new THREE.Group();
      const accent = M(accentHex);
      const n = Math.max(4, Math.round(width / 0.32)), sw = width / n;
      for (let i = 0; i < n; i++) {
        const s = box(sw, .05, depth, i % 2 ? whiteMat : accent);
        s.position.set(-width / 2 + sw * (i + .5), 0, depth / 2); g.add(s);
      }
      g.rotation.x = .42;
      return g;
    }

    const skins = [0xe9c9a5, 0xc99a6b, 0x8d5a3b, 0xf1d3b3];
    const shirts = [0xb5543c, 0x3fbf8f, 0x6c7bd9, 0xd4a73a, 0xc9ccd3, 0xe07a9a, 0x56a3c9];
    function person(){
      const g = new THREE.Group();
      add(g, box(.22, .14, .14, darkMat), 0, .07, 0);
      add(g, cyl(.13, .17, .55, M(pick(shirts)), 8), 0, .41, 0);
      const head = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), M(pick(skins), { flatShading: false }));
      head.castShadow = true; add(g, head, 0, .8, 0);
      return g;
    }
    function queue(g, x, n){
      for (let i = 0; i < n; i++) { const p = person(); p.rotation.y = Math.PI; add(g, p, x + rand(-.08, .08), 0, .55 + i * .5); }
    }
    function cafeTable(accentHex){
      const g = new THREE.Group();
      add(g, cyl(.32, .32, .05, whiteMat, 12), 0, .55, 0);
      add(g, cyl(.04, .05, .55, darkMat, 6), 0, .27, 0);
      add(g, box(.24, .32, .24, M(0x5a4636)), -.48, .16, 0);

        if (b.d === 'park') return;
        const locked = isLocked(b);
        if (locked) { b.site.visible = true; b.G.visible = false; return; }
        const wasHidden = !b.G.visible;
        b.G.visible = true;
        if (animate && wasHidden) {
          const delay = k++ * .25, G = b.G, site = b.site;
          G.scale.y = .01;
          for (let i = 0; i < 16; i++) puff(b.x + rand(-11, 11), .4, b.z + rand(-4, 4), 0xb5a68a, .45, 1.4, 1.4);
          tween(.5 + delay, () => {}, () => { site.visible = false; tween(1.0, q => { G.scale.y = Math.max(.01, easeOut(q)); }); });
        } else { b.site.visible = false; b.G.scale.y = 1; }
      });
      plots.forEach(p => {
        const L = isLocked(p.block);
        if (!L && animate && !p.group.visible) { const g = p.group, s0 = g.scale.x; g.scale.y = .01; tween(1.6, q => { g.scale.y = Math.max(.01, s0 * easeOut(q)); }); }
        p.group.visible = !L; if (p.ped) p.ped.visible = !L; if (p.pin) p.pin.visible = !L;
      });
      walkers.forEach(w => { w.g.visible = !isLocked(w.b); });
      writeTrees();
      Object.keys(DISTRICTS).forEach(placeLabel);
      const open = Object.keys(DISTRICTS).filter(k2 => STAGE_OF[k2] <= cityStage).length;
      subEl.textContent = 'Капитал ' + fmt(CAP_NOW[cityStage]) + ' · открыто районов: ' + open + ' из 6';
    }
    applyStage(false);
    const growBtn = document.getElementById('f-grow');
    growBtn.addEventListener('click', () => {
      const prev = cityStage; cityStage = cityStage >= 4 ? 1 : cityStage + 1;
      hideCard(); applyStage(cityStage > prev);
      if (cityStage > prev) {
        const keys = Object.keys(DISTRICTS).filter(k2 => STAGE_OF[k2] === cityStage);
        const c = keys.map(districtCenter).reduce((a, q) => [a[0] + q[0] / keys.length, a[1] + q[1] / keys.length], [0, 0]);
        target.set(c[0], 2.4, c[1] + 4); zoomTo(.42);
        toast('Капитал вырос до ' + fmt(CAP_NOW[cityStage]) + '. ' + (keys.length > 1 ? 'Открылись районы: ' : 'Открылся район: ') + keys.map(k2 => DISTRICTS[k2].name).join(', '));
      } else { toast('Начало игры: открыты только Старый город и Спальный район'); target.copy(HOME_C); zoomTo(HOME_Z); }
    });

    /* ---------- camera controls ---------- */
    const HOME_C = new THREE.Vector3(-8, 2.4, 6);
    target.copy(HOME_C);
    function zoomTo(z){ camera.zoom = clamp(z, .22, 2.2); camera.updateProjectionMatrix(); labels.forEach(l => { l.visible = camera.zoom < .8; }); }
    const HOME_Z = stage.clientWidth / stage.clientHeight < 1 ? .5 : .4;
    zoomTo(HOME_Z);
    const pointers = new Map();
    let down = null, pinch = null, lastTap = 0;
    const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
    const vR = new THREE.Vector3(), vU = new THREE.Vector3();
    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) down = { moved: 0 };
      if (pointers.size === 2) { const [a, b] = Array.from(pointers.values()); pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom: camera.zoom }; if (down) down.moved = 99; }
    });
    canvas.addEventListener('pointermove', e => {
      const prev = pointers.get(e.pointerId); if (!prev) return;
      const cur = { x: e.clientX, y: e.clientY }; pointers.set(e.pointerId, cur);
      if (pointers.size === 1) {
        const dx = cur.x - prev.x, dy = cur.y - prev.y;
        if (down) down.moved += Math.abs(dx) + Math.abs(dy);
        const wpp = (camera.right - camera.left) / camera.zoom / stage.clientWidth;
        vR.setFromMatrixColumn(camera.matrix, 0); vR.y = 0; vR.normalize();
        vU.setFromMatrixColumn(camera.matrix, 1); vU.y = 0; const L = vU.length() || 1; vU.normalize();
        target.addScaledVector(vR, -dx * wpp).addScaledVector(vU, dy * wpp / L);
        target.x = clamp(target.x, -cityW / 2, cityW / 2); target.z = clamp(target.z, -cityD / 2, cityD / 2 + 10);
      } else if (pointers.size === 2 && pinch) {
        const [a, b] = Array.from(pointers.values());
        zoomTo(pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinch.dist);
      }
    });
    function endPointer(e){
      if (!pointers.has(e.pointerId)) return;
      const wasSingle = pointers.size === 1;
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (wasSingle && down && down.moved < 8 && e.type === 'pointerup') {
        const now = performance.now();
        if (now - lastTap < 320) { target.copy(HOME_C); zoomTo(HOME_Z); lastTap = 0; }
        else {
          lastTap = now;
          const r = canvas.getBoundingClientRect();
          ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
          raycaster.setFromCamera(ndc, camera);
          const hits = raycaster.intersectObjects(scene.children, true).filter(h => h.object.isMesh && h.object !== ground);
          const hp = hits.find(h => h.object.userData.plot);
          if (hp && (hits[0] === hp || hits[0].distance > hp.distance - .5)) { showPlot(hp.object.userData.plot); }
          else if (hits.length) {
            const pt = hits[0].point;
            const hm = homes.find(h => !isLocked(h.b) && Math.abs(pt.x - h.x) <= h.hw && Math.abs(pt.z - h.z) <= h.hd) || (stadiumHome && Math.abs(pt.x - stadiumHome.x) <= 13 && Math.abs(pt.z - stadiumHome.z) <= 8.5 ? stadiumHome : null);
            const lb = blocks.find(b => b.d !== 'park' && isLocked(b) && Math.abs(pt.x - b.x) <= BW / 2 + SW && Math.abs(pt.z - b.z) <= BD / 2 + SW);
            if (hm) showHome(hm); else if (lb) showSite(lb); else if (hp) showPlot(hp.object.userData.plot); else hideCard();
          } else hideCard();
        }
      }
      if (pointers.size === 0) down = null;
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('wheel', e => { e.preventDefault(); zoomTo(camera.zoom * (e.deltaY < 0 ? 1.1 : .9)); }, { passive: false });

    /* ---------- loop ---------- */
    let last = performance.now(), clock = 0, coinT = 0, smokeT = 0, occT = 0, visible = true;
    const halfW = cityW / 2, halfD = cityD / 2, tmpV = new THREE.Vector3();
    function frameLoop(){
      const now = performance.now();
      const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i]; tw.t += dt; const q = Math.min(1, tw.t / tw.dur);
        tw.fn(q); if (q >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
      }
      blocks.forEach(b => {
        if (b.site && b.site.visible && b.site.userData.anims) b.site.userData.anims.forEach(fn => fn(clock, dt));
        if (!b.pairs) return;
        const tgt = occl.has(b) ? .2 : 1, cur = b.op === undefined ? 1 : b.op;
        if (Math.abs(cur - tgt) > .005) { const nx = Math.abs(tgt - cur) < .02 ? tgt : cur + (tgt - cur) * Math.min(1, dt * 7); b.op = nx; setBlockOpacity(b, nx); }
      });
      occT += dt; if (occT > .25) { occT = 0; checkOcclusion(); }
      updateConstruction(dt);
      plots.forEach(p => {
        const u = p.group.userData;
        if (u.anims) u.anims.forEach(fn => fn(clock, dt));
        if (u.flicker) u.flicker.forEach((m, i) => m.color.setRGB(1, .42 + .1 * Math.sin(clock * 11 + i * 2), .12));
      });
      if (!reduce) {
        cars.forEach(c => {
          if (c.vertical) { c.g.position.z += c.dir * c.speed * dt; if (c.g.position.z > halfD) c.g.position.z = -halfD; if (c.g.position.z < -halfD) c.g.position.z = halfD; }
          else { const L = c.lim || halfW; c.g.position.x += c.dir * c.speed * dt; if (c.g.position.x > L) c.g.position.x = -L; if (c.g.position.x < -L) c.g.position.x = L; }
        });
        walkers.forEach(w => {
          w.g.position.x += w.dir * w.speed * dt;
          const lo = w.b.x - BW / 2 - SW + .3, hi = w.b.x + BW / 2 + SW - .3;
          if (w.g.position.x > hi) w.g.position.x = lo; if (w.g.position.x < lo) w.g.position.x = hi;
          w.g.position.y = .12 + Math.abs(Math.sin(clock * 7 + w.ph)) * .05;
        });
        myPins.forEach(m => { m.pin.position.y = m.base + Math.sin(clock * 2.2 + m.ph) * .18; });
        if (fountainJet) fountainJet.scale.y = 1 + .18 * Math.sin(clock * 6);
        smokeT += dt;
        if (smokeT > .9) {
          smokeT = 0;
          plots.forEach(p => (p.group.userData.smoke || []).forEach(e => {
            tmpV.set(e.x, e.y, e.z); p.group.localToWorld(tmpV);
            if (e.kind === 'steam') puff(tmpV.x, tmpV.y, tmpV.z, 0xf2f2f4, .1, .9, 1.6); else puff(tmpV.x, tmpV.y, tmpV.z, 0x8f8a86, .16, 1.6, 2.4);
          }));
          smokeSpots.forEach(e => { if (!isLocked(e.b)) puff(e.x, e.y, e.z, 0x8f8a86, .3, 2.4, 3); });
        }
      }
      coinT += dt;
      if (coinT > (reduce ? 4 : 2.2)) { coinT = 0; spawnCoin(); }
      placeCamera();
      renderer.render(scene, camera);
    }
    function setRunning(on){ renderer.setAnimationLoop(on ? frameLoop : null); if (on) last = performance.now(); }
    setRunning(true);
    new IntersectionObserver(entries => { visible = entries[0].isIntersecting; setRunning(visible && !document.hidden); }).observe(stage);
    document.addEventListener('visibilitychange', () => setRunning(visible && !document.hidden));
    window.__city = { startConstruction, finishConstruction, cars,  plots, homes, target, zoomTo, applyTime, setFilter, showPlot, showHome, heatBtn, info: () => renderer.info.render.calls, faded: () => blocks.filter(b => b.op !== undefined && b.op < .9).map(b => b.d) };
  }
})();
</script>
