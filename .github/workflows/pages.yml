# Сайт игры на GitHub Pages: после каждого изменения в main собираем app/ и выкладываем в ветку gh-pages.
# Адрес: https://shikhmetov222-svg.github.io/The-first-/
name: Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        working-directory: app
        run: |
          npm ci
          npx vite build --base=/The-first-/
          touch dist/.nojekyll
      - name: Publish to gh-pages
        working-directory: app/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
