# Сайт игры на GitHub Pages: после каждого изменения в app/ собираем и выкладываем.
# Адрес: https://shikhmetov222-svg.github.io/The-first-/
# «Золотой номер» (golden-number/app) выкладывается рядом: https://shikhmetov222-svg.github.io/The-first-/zolotoy/
# Один раз нужно включить: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'golden-number/app/**', 'golden-number/supabase/functions/_shared/game/**', 'colony-mars/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            golden-number/app/package-lock.json
      - name: Build
        working-directory: app
        run: |
          npm ci
          npx vite build --base=/The-first-/
      # Ошибка в «Золотом номере» не должна мешать выкладке CAPITAL — поэтому continue-on-error.
      - name: Build Golden Number
        continue-on-error: true
        working-directory: golden-number/app
        env:
          VITE_API_URL: https://vufqhvjaonqiplcardiw.supabase.co/functions/v1/golden-number
        run: |
          npm ci
          npm run build
          cp -r dist ../../app/dist/zolotoy
      # «Колония на Марсе» (colony-mars) выкладывается рядом: https://shikhmetov222-svg.github.io/The-first-/colony-mars/
      # Копируем только файлы игры для браузера. balance.js и SQL на сайт не попадают.
      - name: Copy Colony Mars
        run: |
          mkdir -p app/dist/colony-mars
          cp colony-mars/index.html colony-mars/style.css colony-mars/app.js colony-mars/lobby.js colony-mars/config.js app/dist/colony-mars/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
